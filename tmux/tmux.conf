# https://qiita.com/yuta3003/items/d511ed7ff0e960994329
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'gmoe/tmux-wifi'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-time 500

set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.config/tmux/plugins/tpm/tpm'

set -g status-left ""
set -g status-right '#[fg=white,bg=brightblack]VPN:#[fg=colour11]#(test -x $HOME/.config/tmux/scripts/vpn.sh && $HOME/.config/tmux/scripts/vpn.sh) #[fg=black]|#[fg=white]Wi-Fi: #(test -x $HOME/.config/tmux/scripts/wifi.sh && $HOME/.config/tmux/scripts/wifi.sh) #[fg=black]|#[fg=white] #(test -x $HOME/.config/tmux/scripts/battery.sh && $HOME/.config/tmux/scripts/battery.sh) #[fg=black]|#[fg=white,bold] %Y-%m-%d %H:%M'

set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"

set -g window-status-separator ""
setw -g window-status-bell-style default
setw -g window-status-activity-style default

set -g prefix C-q
unbind C-b
bind C-q send-prefix

set-option -g bell-action none
set-option -g history-limit 10000
set -s escape-time 0
set-window-option -g mode-keys vi
set-window-option -g monitor-activity on
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down
set -s copy-command 'pbcopy'

unbind r
bind-key -N "Reload config" r source-file ~/.config/tmux/tmux.conf

set -g status-interval 10
set-option -g status-right-length 120

bind-key -N "Split horizontally" | split-window -h
bind-key -N "Split vertically" - split-window -v

bind-key -N "Select left pane" h select-pane -L
bind-key -N "Select down pane" j select-pane -D
bind-key -N "Select up pane" k select-pane -U
bind-key -N "Select right pane" l select-pane -R

bind-key -r -N "Resize pane left" H resize-pane -L 5
bind-key -r -N "Resize pane down" J resize-pane -D 5
bind-key -r -N "Resize pane up" K resize-pane -U 5
bind-key -r -N "Resize pane right" L resize-pane -R 5

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"

bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"

bind-key -r -N "Sync panes off" u set-window-option synchronize-panes off
bind-key -r -N "Sync panes on" U set-window-option synchronize-panes on

set-option -g status-position bottom

set -g window-style 'fg=colour234,bg=colour238'
set -g window-active-style 'fg=terminal,bg=terminal'

set -g pane-active-border-style fg=cyan
set -g pane-border-style fg=brightblack
